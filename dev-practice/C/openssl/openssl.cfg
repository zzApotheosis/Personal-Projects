[ req ]
distinguished_name = req_distinguished_name
req_extensions = v3_req
prompt = no

[ req_distinguished_name ]
#CN = my-server-name.com
CN = localhost

[ v3_req ]
subjectAltName = @alt_names

[ alt_names ]
# Use 'IP.' for IP addresses and 'DNS.' for hostnames
IP.1 = 127.0.0.1
IP.2 = 192.168.1.100
DNS.1 = localhost
DNS.2 = my-server-name.com
