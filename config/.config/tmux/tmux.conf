# remap prefix
unbind C-b
set -g prefix `
bind-key ` send-prefix

# Set escape-time
set -sg escape-time 0

# Explicitly define default shell
#set -g default-shell "/bin/fish"
#set -g default-command "$HOME/.cargo/bin/nu"

# Request tmux to set a custom TERM
set -g default-terminal "tmux-256color"
#set -sa terminal-overrides ",xterm*:Tc"
#set -ag terminal-overrides ",xterm-256color:RGB"
#set -as terminal-features ",screen-256color:RGB"

# Enable mouse support
set -g mouse

# Set fast pane-switching
# bind -n M-h select-pane -L
# bind -n M-l select-pane -R
# bind -n M-k select-pane -U
# bind -n M-j select-pane -D
bind -n M-h if-shell -F '#{pane_at_left}' 'prev' 'select-pane -L'
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l if-shell -F '#{pane_at_right}' 'next' 'select-pane -R'

# Set styling
set -g status-left ''
set -g status-style 'bg=#010101,fg=#ffffff'
set -g status-right-length 100
set -g status-right-style 'bg=#c40000,fg=#ffffff'
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}(#{pid}:#{session_name}) %Y%m%dT%H%M%S%z'
set -g pane-border-style 'fg=#010101,bg=#010101'
set -g pane-active-border-style 'fg=#c40000,bg=#010101'
setw -g window-status-format '(#I #W#F)'
setw -g window-status-current-style 'bg=#c40000,fg=#ffffff'
setw -g window-status-current-format '(#I #W#F)'
